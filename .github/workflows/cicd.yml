# Build and deploy ChronoProof (Bun + Express) to Azure Web App - chrprai
# Modeled on Azure's generated workflow, adapted from Python to Bun.

name: Build and deploy ChronoProof to Azure Web App - chrprai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The token/JWKS tests need an RS256 keypair. keys/ is gitignored, so
      # generate an EPHEMERAL pair for the test run only (never deployed).
      - name: Generate ephemeral RSA keys (test-only)
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      # Ship node_modules (App Service does not build Bun). Prune devDependencies
      # first so the artifact is production-only.
      - name: Prune to production dependencies
        run: bun install --frozen-lockfile --production

      - name: Assemble deployment artifact (no keys/tests/docs/.git)
        run: |
          rm -rf deploy && mkdir -p deploy
          cp -r src package.json bun.lock startup.sh node_modules deploy/
          chmod +x deploy/startup.sh

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: chronoproof-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # required for OIDC (azure/login)
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: chronoproof-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BC24BFC093DC4D37AF742B0360CC58F1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_330E59F41C4346FBA33D3463F80840EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_58E4CE3CD8E2404582F41322E8ED0C53 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'chrprai'
          slot-name: 'Production'
          package: .
